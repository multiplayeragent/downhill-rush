 *   ME ............ carving, tucking, gates, the run timer. Each player writes only its own.
 *   HUD & RESULTS . place, gates, timer, countdown, results, leaderboard
 *   INPUT ......... keyboard and touch

 *     heading, speed, height in the air, tuck, gates missed, finish time) about 15 times a

 *     worked out every frame. Only the host writes the shared fields `race` (id, version

 *     adopts both and carries on.
 *   - Every client builds the same gates from race.seed (a seeded random generator), so
 *     the course itself is never sent.
 *   - Each skier is timed from the moment it crosses the start line to the finish line,

 *   - Other skiers are drawn a little ahead of their last update (speed × time since),
 *     then eased, so they glide instead of stepping.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-run": each player's best time (stored as 600000 - ms, so

const renderer = new THREE.WebGLRenderer({ antialias: true });

// Sky: a dome from deep blue overhead to pale at the horizon.
const skyGeo = new THREE.SphereGeometry(2500, 32, 20), skyCol = [], top = new THREE.Color("#3f8fe8"), low = new THREE.Color("#e6f3ff");
for (let i = 0; i < skyGeo.attributes.position.count; i++) { const c = low.clone().lerp(top, clamp(skyGeo.attributes.position.getY(i) / 1200, 0, 1) ** 0.6); skyCol.push(c.r, c.g, c.b); }

// The snow: one big sheet that follows the run, with faint groomed lines.
const cordTex = canvasTex(64, 64, (c) => { c.fillStyle = "#ffffff"; c.fillRect(0, 0, 64, 64); c.fillStyle = "#edf2fa"; for (let x = 0; x < 64; x += 8) c.fillRect(x, 0, 3, 64); }, true);

scene.add(new THREE.Mesh(snowGeo, new THREE.MeshStandardMaterial({ vertexColors: true, map: cordTex, roughness: 0.95 })));

const TREES = 520, mtx = new THREE.Matrix4(), q0 = new THREE.Quaternion();

// Mountains far down the valley (no fog, painted pale so they look far away).
const peakGeo = new THREE.ConeGeometry(1, 1, 9, 4), peakCol = [];

    if (r.phase === "grid") continue; // held at the start
    if (!b.pushed) { b.pushed = true; b.v = Math.max(b.v, CONFIG.pushOff); }
    const pz = b.z, ev = stepSkier(b, b.ft ? { steer: 0, tuck: false } : autoInput(b, b.skill, b.plan), dt);
    if (pz < 0 && b.z >= 0) b.t0 = t;
    crossGates(b, pz, () => {});
    if (!b.ft && b.t0 && b.z >= CONFIG.length) b.ft = t - b.t0 + b.pen * CONFIG.missPenalty;
  }
  separate([...host.bots.values()], true);
  if (now - host.lastBots > 100) {
    host.lastBots = now;
    net.setShared("bots", JSON.stringify(botList().map((b) => ({ ...b, x: +b.x.toFixed(2), z: +b.z.toFixed(2), h: +b.h.toFixed(3), v: +b.v.toFixed(1), ay: +b.ay.toFixed(2), l: +b.l.toFixed(2), sk: +b.sk.toFixed(2) }))));
  }
}
/** Skiers that bump slide apart sideways: bots push each other; anyone pushes out of everyone else. */
function separate(list, bots) {
  const others = bots ? [me, ...[...views.entries()].filter(([id]) => !host.bots.has(id)).map(([, v]) => v)] : [...views.values()];
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (const o of bots ? [...list.slice(i + 1), ...others] : others) {
      const dz = a.z - o.z, dx = a.x - o.x;
      if (Math.abs(dz) > 1.8 || Math.abs(dx) > 1.6) continue;
      const push = (1.6 - Math.abs(dx)) * 0.5, s = Math.sign(dx) || 1;
      a.x += s * push; if (bots && host.bots.has(o.id)) o.x -= s * push;
    }
  }
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Swift", "Snowy", "Frosty", "Brave", "Zippy", "Lucky"][Math.floor(Math.random() * 6)] + " " + ["Skier", "Racer", "Yeti", "Fox", "Owl"][Math.floor(Math.random() * 5)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
/** Two people joined at once in one color: the one with the higher sessionId picks a free one. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.c)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); if (me.g) { dropSkier(me.g); me.g = null; } }
}
const me = Object.assign(newSkier(0, -5), { g: null, gi: 0, pen: 0, t0: 0, ft: 0, raceId: -1, best: 0, lastSend: 0, submitted: -1, plan: null });
const input = { left: false, right: false, tuck: false, axis: 0 };

/** My start spot: my place among the live players, or the first one no other player is in. */
function mySlot(r) {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => parse(p.s, null)).filter((k) => k && k.r === r.id);
  const free = (s) => !others.some((k) => Math.abs(k.x - s.x) < 1.5 && Math.abs(k.z - s.z) < 1.5);
  let n = Math.max(0, livePlayers().indexOf(net.sessionId));
  while (!free(startSlot(n)) && n < 24) n++;
  return startSlot(n);
}
function resetToStart(r) {
  me.raceId = r.id;
  if (course.seed !== r.seed) buildGates(r.seed);
  const s = ATTRACT ? { x: centerX(-14), z: -14 } : r.phase === "grid" ? mySlot(r) : startSlot(Math.floor(Math.random() * 8));
  Object.assign(me, newSkier(s.x, s.z), { gi: 0, pen: 0, t0: 0, ft: 0, pushed: false });
  if (ATTRACT) me.plan = course.gates.map(() => 0);
  $("over").hidden = true;
}

function myTick(dt, r, now) {
  if (me.raceId !== r.id) resetToStart(r);
  if (r.phase === "grid") { publish(now); return; } // waiting at the start
  if (!me.pushed) { me.pushed = true; me.v = CONFIG.pushOff; }
  if (ATTRACT) { const a = autoInput(me, 1, me.plan); input.axis = a.steer; input.tuck = a.tuck; } // starts behind the pack and catches it
  const steer = input.axis || (input.left ? 1 : 0) - (input.right ? 1 : 0); // + = toward +x, which is screen left looking downhill
  const pz = me.z, ev = stepSkier(me, me.ft ? { steer: steer * 0.5, tuck: false } : { steer, tuck: input.tuck }, dt);
  if (ev === "jump") { beep(260, 0.4, "sine", 0.1, 620); toast("Big air!", 900); }
  if (ev === "land") { beep(90, 0.15, "triangle", 0.15); burst(me.x, groundH(me.x, me.z) + 0.2, me.z, "#cfe2fa", 14, 5, 0.6); }
  if (ev === "fence") { beep(140, 0.12, "square", 0.08); burst(me.x, groundH(me.x, me.z) + 0.6, me.z, "#ff6a1a", 8, 4); }
  if (!me.air) spray(me.x, me.z, me.h, me.lean, me.v);
  if (pz < 0 && me.z >= 0 && !me.t0) me.t0 = Date.now(); // your clock starts at the start line
  if (!me.ft) crossGates(me, pz, (g, ok) => {
    markGate(g, ok);
    if (ok) { beep(880, 0.1, "sine", 0.1); setTimeout(() => beep(1320, 0.12, "sine", 0.08), 70); burst(g.x, groundH(g.x, g.z) + 1.5, g.z, "#3ddc84", 10, 4); }
    else { beep(150, 0.3, "square", 0.08); toast(`Missed gate! +${CONFIG.missPenalty / 1000}s`, 1200, true); }
  });
  if (!me.ft && me.t0 && me.z >= CONFIG.length) finish(r);
  separate([me], false);
  publish(now);
}
function finish(r) {
  me.ft = Date.now() - me.t0 + me.pen * CONFIG.missPenalty;
  if (!me.best || me.ft < me.best) me.best = me.ft;
  beep(660, 0.15); setTimeout(() => beep(880, 0.15), 140); setTimeout(() => beep(1320, 0.35), 280);
  burst(me.x, groundH(me.x, me.z) + 1, me.z, myColor, 40, 7);
  toast(`${fmt(me.ft)}${me.pen ? ` (${me.pen} missed)` : ""}`, 2600);
}
function publish(now) {
  if (now - me.lastSend < 66) return;
  me.lastSend = now;
  net.me.set("s", JSON.stringify({ r: me.raceId, x: +me.x.toFixed(2), z: +me.z.toFixed(2), h: +me.h.toFixed(3), v: +me.v.toFixed(1), ay: +me.ay.toFixed(2), tk: me.tuck ? 1 : 0, l: +me.lean.toFixed(2), pen: me.pen, ft: me.ft }));
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${String(Math.floor((ms % 1000) / 10)).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1500, bad = false) { if (ATTRACT) return; const m = $("msg"); m.textContent = text; m.classList.toggle("bad", bad); m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1, lastCount = "", started = 0;
function hud(r, now) {
  const t = Date.now();
  const count = r.phase === "grid" && r.startAt - t < 3000 ? String(Math.max(1, Math.ceil((r.startAt - t) / 1000))) : r.phase === "race" && t - r.startAt < 900 ? "GO!" : "";
  if (count !== lastCount) { lastCount = count; if (count === "GO!") beep(880, 0.4, "square", 0.08); else if (count) beep(440, 0.15, "square", 0.08); }
  $("count").textContent = count;
  if (ATTRACT) { for (const id of ["pos", "gates", "time", "net", "hint"]) $(id).textContent = ""; return; }
  const order = racers(), at = order.findIndex((x) => x.mine) + 1, n = course.gates.length;
  $("pos").innerHTML = at ? `${ord(at)} <small>/ ${order.length}</small>` : "";
  $("gates").innerHTML = `Gate ${Math.min(n, me.gi + (me.ft ? 0 : 1))}/${n}${me.pen ? ` · <b>${me.pen} missed (+${(me.pen * CONFIG.missPenalty) / 1000}s)</b>` : ""}`;
  const run = me.ft || (me.t0 ? t - me.t0 + me.pen * CONFIG.missPenalty : 0);
  $("time").innerHTML = `${fmt(run)}<small>${Math.round(me.v * 3)} km/h${me.best ? ` · best ${fmt(me.best)}` : ""}</small>`;
  $("hint").textContent = r.phase === "grid" && r.startAt - t >= 3000 ? "Next run starting…" : me.ft && r.phase === "race" ? "Waiting for the others…" :
    now - started < 14000 ? (touchUI ? "◀ ▶ to carve · hold TUCK for speed · pass between the flags" : "←/→ to carve · hold ↓ or Space to tuck · pass between the flags") : "";
  const np = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${np} player${np === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    const res = [...r.results].sort((a, b) => (a.ft && b.ft ? a.ft - b.ft : a.ft ? -1 : b.ft ? 1 : 0));
    $("results").innerHTML = res.map((x) => `<li class="${x.id === net.sessionId ? "me" : ""}">${esc(x.n)}${x.pen ? `<em>+${x.pen} gate${x.pen > 1 ? "s" : ""}</em>` : ""}<span>${x.ft ? fmt(x.ft) : "DNF"}</span></li>`).join("");
    $("next").textContent = `Next run in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(); }
  }
}
function showBoard() {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  const submit = me.ft && me.submitted !== me.raceId ? board.submit(Math.max(0, 600000 - me.ft)).catch(() => null) : Promise.resolve();
  me.submitted = me.raceId;
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function again() { const r = race(); if (r && r.phase === "done" && isHost()) newRace(r.id + 1); }
$("again").onclick = () => { if (isHost()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowDown: "tuck", s: "tuck", S: "tuck", " ": "tuck", Shift: "tuck" };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
renderer.domElement.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, camH = 0;
const camLook = new THREE.Vector3(), camWant = new THREE.Vector3();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const r = race();
  if (r && course.seed !== r.seed) buildGates(r.seed);
  if (r) myTick(dt, r, now);
  // everyone else
  const seen = new Set(), live = new Set(livePlayers()); // a closed tab can linger in state for a while: skip it
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.s, null); if (!k || !r || k.r !== r.id) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); follow(v, k, dt, now, false);
    placeSkier(v.g, v.x, v.z, v.h, v.ay, !!k.tk, k.l || 0, v.ay > 0.1);
    if (v.ay < 0.05) spray(v.x, v.z, v.h, k.l || 0, k.v || 0);
  }
  const exact = isHost();
  for (const b of botList()) {
    seen.add(b.i); const v = viewOf(b.i, b.c, b.n); follow(v, b, dt, now, exact);
    placeSkier(v.g, v.x, v.z, v.h, v.ay, !!b.tk, b.l || 0, v.ay > 0.1);
    if (v.ay < 0.05) spray(v.x, v.z, v.h, b.l || 0, b.v || 0);
  }
  for (const [id, v] of views) if (!seen.has(id)) { dropSkier(v.g); views.delete(id); }
  if (!me.g) me.g = makeSkier(myColor, "");
  placeSkier(me.g, me.x, me.z, me.h, me.ay, me.tuck, me.lean, me.air);
  for (const g of course.gates) for (const f of g.flags) f.rotation.y = Math.sin(now / 300 + g.z) * 0.25;
  tickBits(dt); tickFlakes(dt, now / 1000);
  // chase camera: behind and above, looking down the hill
  camH += angle(me.h * 0.6 - camH) * Math.min(1, dt * 3);
  const tall = camera.aspect < 1, back = ATTRACT ? 6.5 : tall ? 9 : 6.5, high = ATTRACT ? 2 : tall ? 4.2 : 1.8; // a phone held upright looks further down the hill
  camWant.set(me.x - Math.sin(camH) * back, groundH(me.x, me.z) + back * CONFIG.slope + high + me.ay * 0.6, me.z - Math.cos(camH) * back);
  camera.position.copy(camWant);
  camLook.set(me.x + Math.sin(camH) * 14, groundH(me.x, me.z) - (tall ? 3.5 : 0.4) + me.ay * 0.7, me.z + Math.cos(camH) * 14);
  camera.lookAt(camLook);
  const fov = (camera.aspect < 1 ? 78 : 60) + (me.tuck ? 6 : 0) + clamp(me.v / 50, 0, 1) * 8;
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
  requestAnimationFrame(frame);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1200, resultsFor: 1500, seats: 7 });
  camera.position.set(me.x, groundH(me.x, -14) + 5, -14);
  started = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
